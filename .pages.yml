# Estúdio de edição do portfólio (Pages CMS — https://pagescms.org)
# Este arquivo define os formulários que aparecem no painel.

media:
  input: media
  output: /media
  rename: safe
  extensions: [jpg, jpeg, png, webp, gif, svg, mp4, webm]

content:
  # ---------------------------------------------------------------- PROJETOS
  - name: projetos
    label: Projetos
    type: file
    path: content/projects.json
    format: json
    list: true
    fields:
      - name: name
        label: Nome do projeto
        type: string
        required: true
      - name: slug
        label: Endereço do projeto
        description: "Usado no link do projeto. Só letras minúsculas, números e hífen. Ex.: flora-atelie"
        type: string
        required: true
      - name: year
        label: Ano
        type: string
      - name: client
        label: Cliente
        type: string
      - name: scope_pt
        label: Escopo (português)
        description: "Ex.: Identidade visual, papelaria"
        type: string
      - name: scope_en
        label: Escopo (inglês)
        type: string
      - name: credits
        label: Créditos
        description: "Uma linha para cada pessoa. Use dois-pontos para separar a função do nome, ex.: Fotografia: Ana Lima (a função aparece em cinza)."
        type: text
      - name: cover
        label: Capa (imagem ou vídeo)
        description: "Aparece em tela cheia no topo da página do projeto (e na home, se você não escolher capas próprias para ela abaixo). Vídeos .mp4 rodam em loop, sem som."
        type: file
        options:
          extensions: [jpg, jpeg, png, webp, gif, svg, mp4, webm]
      - name: cover_url
        label: Capa — link do YouTube ou Vimeo
        description: "Opcional. Cole o link de um vídeo do YouTube ou do Vimeo. Se preenchido, ele aparece no lugar do arquivo e toca sozinho, sem som e em loop."
        type: string
      - name: home_cover
        label: Capa da home — computador
        description: "Opcional. A imagem ou vídeo que aparece no topo da home no computador (formato horizontal). Vazio = usa a Capa do projeto."
        type: file
        options:
          extensions: [jpg, jpeg, png, webp, gif, svg, mp4, webm]
      - name: home_cover_url
        label: Capa da home — computador — link do YouTube ou Vimeo
        description: "Opcional. Se preenchido, aparece no lugar do arquivo acima."
        type: string
      - name: home_mobile
        label: Capa da home — celular
        description: "Opcional. A imagem ou vídeo que aparece no topo da home no celular. Funciona melhor em pé (ex.: 4:5 ou 9:16). Vazio = usa a capa do computador."
        type: file
        options:
          extensions: [jpg, jpeg, png, webp, gif, svg, mp4, webm]
      - name: home_mobile_url
        label: Capa da home — celular — link do YouTube ou Vimeo
        description: "Opcional. Se preenchido, aparece no lugar do arquivo acima."
        type: string
      - name: problem_pt
        label: Problema (português)
        type: text
      - name: problem_en
        label: Problema (inglês)
        type: text
      - name: challenge_pt
        label: Desafio (português)
        type: text
      - name: challenge_en
        label: Desafio (inglês)
        type: text
      - name: solution_pt
        label: Solução (português)
        type: text
      - name: solution_en
        label: Solução (inglês)
        type: text
      - name: gallery_style
        label: Estilo da galeria
        description: "Com respiro deixa um espaço fino e cantos arredondados entre as imagens. Colado encosta uma imagem na outra."
        type: select
        options:
          values:
            - name: respiro
              label: Com respiro
            - name: colado
              label: Colado
      - name: gallery
        label: Galeria
        description: "Adicione blocos na ordem em que devem aparecer."
        type: block
        list: true
        blockKey: type
        blocks:
          - name: inteira
            label: Imagem inteira
            fields:
              - name: media
                label: Imagem ou vídeo
                type: file
                options:
                  extensions: [jpg, jpeg, png, webp, gif, svg, mp4, webm]
              - name: video_url
                label: Ou link do YouTube ou Vimeo
                description: "Opcional. Cole o link de um vídeo do YouTube ou do Vimeo. Se preenchido, ele aparece no lugar do arquivo e toca sozinho, sem som e em loop."
                type: string
              - name: natural
                label: Manter a altura original
                description: "Ligado: a imagem aparece inteira, sem corte, com a altura proporcional à largura. Desligado: a imagem é cortada no formato padrão da galeria."
                type: boolean
              - name: hide_mobile
                label: Esconder no celular
                description: "Ligado: este bloco não aparece no celular."
                type: boolean
          - name: dupla
            label: Duas imagens lado a lado
            fields:
              - name: left
                label: Esquerda
                type: file
                options:
                  extensions: [jpg, jpeg, png, webp, gif, svg, mp4, webm]
              - name: left_url
                label: Esquerda — ou link do YouTube ou Vimeo
                description: "Opcional. Cole o link de um vídeo do YouTube ou do Vimeo. Se preenchido, ele aparece no lugar do arquivo e toca sozinho, sem som e em loop."
                type: string
              - name: right
                label: Direita
                type: file
                options:
                  extensions: [jpg, jpeg, png, webp, gif, svg, mp4, webm]
              - name: right_url
                label: Direita — ou link do YouTube ou Vimeo
                description: "Opcional. Cole o link de um vídeo do YouTube ou do Vimeo. Se preenchido, ele aparece no lugar do arquivo e toca sozinho, sem som e em loop."
                type: string
              - name: hide_mobile
                label: Esconder no celular
                description: "Ligado: este bloco não aparece no celular."
                type: boolean
          - name: grade3
            label: Grade de 3
            fields:
              - name: cells
                label: Espaços (até 3)
                description: "Cada espaço pode ser imagem, vídeo ou texto. Se tiver imagem ou vídeo, o texto é ignorado."
                type: object
                list:
                  min: 1
                  max: 3
                fields:
                  - name: media
                    label: Imagem ou vídeo
                    type: file
                    options:
                      extensions: [jpg, jpeg, png, webp, gif, svg, mp4, webm]
                  - name: video_url
                    label: Ou link do YouTube ou Vimeo
                    type: string
                  - name: text_pt
                    label: Ou texto (português)
                    type: text
                  - name: text_en
                    label: Texto (inglês)
                    type: text
                  - name: bg
                    label: Cor de fundo do texto
                    description: "Opcional. Ex.: #5A1E2B"
                    type: string
                  - name: fg
                    label: Cor do texto
                    description: "Opcional. Ex.: #FFFFFF"
                    type: string
              - name: hide_mobile
                label: Esconder no celular
                description: "Ligado: este bloco não aparece no celular."
                type: boolean
          - name: frase
            label: Frase em destaque
            fields:
              - name: text_pt
                label: Frase (português)
                type: string
              - name: text_en
                label: Frase (inglês)
                type: string
              - name: bg
                label: Cor de fundo
                description: "Opcional. Cole o código da cor, ex.: #5A1E2B. Vazio = cinza claro padrão."
                type: string
              - name: fg
                label: Cor do texto
                description: "Opcional. Ex.: #FFFFFF. Vazio = preto."
                type: string
              - name: hide_mobile
                label: Esconder no celular
                description: "Ligado: este bloco não aparece no celular."
                type: boolean

  # ---------------------------------------------------------------- ARCHIVE
  - name: archive
    label: Archive
    type: file
    path: content/archive.json
    format: json
    list: true
    fields:
      - name: title
        label: Título
        type: string
        required: true
      - name: category_pt
        label: Categoria principal (português)
        description: "Os filtros do Archive são criados a partir das categorias. Escreva sempre do mesmo jeito. Ex.: Cartaz"
        type: string
      - name: category_en
        label: Categoria principal (inglês)
        type: string
      - name: categories
        label: Outras categorias
        description: "Opcional. Para peças que entram em mais de um filtro."
        type: object
        list: true
        fields:
          - { name: name_pt, label: Categoria (português), type: string }
          - { name: name_en, label: Categoria (inglês), type: string }
      - name: year
        label: Ano
        type: string
      - name: video_url
        label: Vídeo do YouTube ou Vimeo (opcional)
        description: "Cole o link. Se preenchido, o vídeo vira a capa da peça no mosaico e a primeira imagem da galeria."
        type: string
      - name: images
        label: Imagens e vídeos
        description: "A primeira é a capa no mosaico. As outras aparecem na galeria quando a peça é aberta."
        type: file
        options:
          multiple:
            max: 20
          extensions: [jpg, jpeg, png, webp, gif, svg, mp4, webm]

  # ---------------------------------------------------------------- TEXTOS GERAIS E SOBRE
  - name: site
    label: Textos gerais e Sobre
    type: file
    path: content/site.json
    format: json
    fields:
      - name: name
        label: Seu nome
        type: string
      - name: email
        label: E-mail
        type: string
      - name: role_pt
        label: Função (português)
        description: "Aparece no título da aba do navegador. Ex.: Designer de identidade visual"
        type: string
      - name: role_en
        label: Função (inglês)
        type: string
      - name: intro_pt
        label: Descrição da home (português)
        description: "Frase curta na faixa fina acima do seu nome, no topo da home. Também é usada no Google."
        type: text
      - name: intro_en
        label: Descrição da home (inglês)
        type: text
      - name: socials
        label: Redes sociais
        type: object
        list: true
        fields:
          - name: name
            label: Nome
            type: string
          - name: url
            label: Link
            type: string
      - name: location_pt
        label: Base (português)
        type: string
      - name: location_en
        label: Base (inglês)
        type: string
      - name: languages_pt
        label: Idiomas (português)
        type: string
      - name: languages_en
        label: Idiomas (inglês)
        type: string
      - name: archive_intro_pt
        label: Texto do Archive (português)
        type: text
      - name: archive_intro_en
        label: Texto do Archive (inglês)
        type: text
      - name: about
        label: Página Sobre
        type: object
        fields:
          - name: photo
            label: Sua foto
            type: image
          - name: statement_pt
            label: Frase de apresentação (português)
            type: text
          - name: statement_en
            label: Frase de apresentação (inglês)
            type: text
          - name: bio_pt
            label: Bio (português)
            description: "Deixe uma linha em branco entre os parágrafos."
            type: text
          - name: bio_en
            label: Bio (inglês)
            type: text
          - name: experience
            label: Experiência
            description: "No período, escreva \"atual\" para o que ainda está em andamento. Em inglês vira \"present\"."
            type: object
            list: true
            fields:
              - { name: name, label: Empresa ou estúdio, type: string }
              - { name: role_pt, label: Cargo (português), type: string }
              - { name: role_en, label: Cargo (inglês), type: string }
              - { name: period, label: Período, type: string }
          - name: education
            label: Formação
            type: object
            list: true
            fields:
              - { name: name, label: Instituição, type: string }
              - { name: role_pt, label: Curso (português), type: string }
              - { name: role_en, label: Curso (inglês), type: string }
              - { name: period, label: Período, type: string }
          - name: recognition
            label: Reconhecimentos
            type: object
            list: true
            fields:
              - { name: name, label: Prêmio ou seleção, type: string }
              - { name: role_pt, label: Detalhe (português), type: string }
              - { name: role_en, label: Detalhe (inglês), type: string }
              - { name: period, label: Ano, type: string }
